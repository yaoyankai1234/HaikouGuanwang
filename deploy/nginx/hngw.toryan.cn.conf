# ============================================================
# hngw.toryan.cn — 海南省美兰区演丰镇沿海村落供水管网延伸工程管理系统
# 后端：node /opt/pms 监听 127.0.0.1:8088
# 证书：复用 acme.sh DNS-01 通配符证书（*.toryan.cn），无需单独签发
#
# 部署：
#   cp deploy/nginx/hngw.toryan.cn.conf /etc/nginx/sites-available/
#   ln -sf /etc/nginx/sites-available/hngw.toryan.cn.conf /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#
# 前置条件：
#   - DNS：hngw.toryan.cn → 服务器公网 IP
#   - 证书：/etc/nginx/ssl/toryan.cn/{fullchain.pem,key.pem}（acme.sh dns_ali 签发）
#   - 后端：pm2 托管 node server/index.mjs，PORT=8088
# ============================================================

# ---------- HTTP：保留 ACME 验证 + 全量跳 HTTPS ----------
server {
    listen 80;
    listen [::]:80;
    server_name hngw.toryan.cn;

    client_max_body_size 16m;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------- HTTPS：供水管网工程管理系统 ----------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name hngw.toryan.cn;

    ssl_certificate     /etc/nginx/ssl/toryan.cn/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/toryan.cn/key.pem;
    ssl_trusted_certificate /etc/nginx/ssl/toryan.cn/fullchain.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000" always;

    client_max_body_size 16m;

    access_log /var/log/nginx/hngw.access.log;
    error_log  /var/log/nginx/hngw.error.log;

    gzip on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    location / {
        proxy_pass http://127.0.0.1:8088;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_connect_timeout 15s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;
        proxy_buffering       off;
    }
}
